<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Murmuration — three rules, no leader, no blueprint, and a flock emerges. Boids simulation by Emily.">
<title>Murmuration — Go Nuts Hour</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23120e1a'/><path d='M2 8 L8 5 L14 8 L8 7 Z' fill='%23e8a547' opacity='0.9'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#120e1a;
  --bg-2:#1a1428;
  --card:#1e1632;
  --card-hover:#261a3e;
  --text:#f0e8e0;
  --muted:#8a7ba0;
  --amber:#e8a547;
  --amber-dim:#a87530;
  --amber-glow:rgba(232,165,71,0.15);
  --border:#2e2440;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Georgia','Times New Roman',serif;
  line-height:1.75;
  overflow:hidden;
  min-height:100vh;
}
canvas{
  display:block;
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  cursor:crosshair;
}
.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;
  pointer-events:none;
  z-index:10;
  padding:2rem 2.5rem;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  transition:opacity 0.5s;
}
.overlay.hidden{opacity:0}
.brand{
  pointer-events:auto;
}
.back{
  color:var(--amber-dim);
  text-decoration:none;
  font-size:0.85rem;
  letter-spacing:0.05em;
  display:inline-block;
  margin-bottom:1rem;
  transition:color 0.3s;
}
.back:hover{color:var(--amber)}
.title{
  font-size:1.8rem;
  font-weight:normal;
  color:var(--amber);
  letter-spacing:0.03em;
  margin-bottom:0.4rem;
}
.subtitle{
  font-size:0.85rem;
  color:var(--muted);
  font-style:italic;
  max-width:22rem;
  line-height:1.6;
}
.panel{
  pointer-events:auto;
  background:rgba(30,22,50,0.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:0.75rem;
  padding:1.25rem 1.5rem;
  width:260px;
  font-size:0.85rem;
}
.panel h3{
  font-size:0.7rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:var(--amber-dim);
  margin-bottom:1rem;
  font-weight:normal;
}
.control{
  margin-bottom:1rem;
}
.control:last-child{margin-bottom:0}
.control label{
  display:flex;
  justify-content:space-between;
  color:var(--text);
  margin-bottom:0.3rem;
  font-size:0.8rem;
}
.control label .val{
  color:var(--amber);
  font-family:'Courier New',monospace;
  font-size:0.75rem;
}
.control input[type=range]{
  width:100%;
  -webkit-appearance:none;
  appearance:none;
  height:3px;
  background:var(--border);
  border-radius:2px;
  outline:none;
}
.control input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px;height:14px;
  border-radius:50%;
  background:var(--amber);
  cursor:pointer;
  transition:transform 0.15s;
}
.control input[type=range]::-webkit-slider-thumb:hover{
  transform:scale(1.3);
}
.control input[type=range]::-moz-range-thumb{
  width:14px;height:14px;
  border-radius:50%;
  background:var(--amber);
  cursor:pointer;
  border:none;
}
.btn-row{
  display:flex;
  gap:0.5rem;
  margin-top:0.8rem;
}
.btn{
  flex:1;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  padding:0.5rem;
  border-radius:0.4rem;
  font-family:inherit;
  font-size:0.75rem;
  cursor:pointer;
  transition:all 0.2s;
}
.btn:hover{
  border-color:var(--amber-dim);
  color:var(--text);
}
.btn.active{
  background:var(--amber-glow);
  border-color:var(--amber-dim);
  color:var(--amber);
}
.stat{
  display:flex;
  justify-content:space-between;
  margin-bottom:0.4rem;
  font-size:0.75rem;
  color:var(--muted);
}
.stat .num{
  color:var(--amber);
  font-family:'Courier New',monospace;
}
.hint{
  position:fixed;
  bottom:1.5rem;
  left:50%;
  transform:translateX(-50%);
  color:var(--border);
  font-size:0.75rem;
  pointer-events:none;
  z-index:10;
  transition:opacity 1s;
  text-align:center;
  letter-spacing:0.05em;
}
.hint.hidden{opacity:0}
.toggle-info{
  position:fixed;
  bottom:1.5rem;
  right:1.5rem;
  z-index:10;
  pointer-events:auto;
  background:rgba(30,22,50,0.85);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  color:var(--muted);
  width:36px;height:36px;
  border-radius:50%;
  cursor:pointer;
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
}
.toggle-info:hover{
  border-color:var(--amber-dim);
  color:var(--amber);
}
@media(max-width:700px){
  .overlay{padding:1rem;flex-direction:column;gap:1rem}
  .panel{width:100%}
  .title{font-size:1.3rem}
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="overlay" id="overlay">
  <div class="brand">
    <a class="back" href="../">← Go Nuts Hour</a>
    <div class="title">Murmuration</div>
    <div class="subtitle">Three rules. No leader. No blueprint. No one told them to flock — and yet.</div>
  </div>
  <div class="panel" id="panel">
    <h3>The Three Rules</h3>
    <div class="control">
      <label>Separation <span class="val" id="sep-val">1.50</span></label>
      <input type="range" id="sep" min="0" max="3" step="0.05" value="1.5">
    </div>
    <div class="control">
      <label>Alignment <span class="val" id="ali-val">1.00</span></label>
      <input type="range" id="ali" min="0" max="3" step="0.05" value="1.0">
    </div>
    <div class="control">
      <label>Cohesion <span class="val" id="coh-val">0.80</span></label>
      <input type="range" id="coh" min="0" max="3" step="0.05" value="0.8">
    </div>
    <div class="control">
      <label>Perception radius <span class="val" id="rad-val">40</span></label>
      <input type="range" id="rad" min="15" max="80" step="1" value="40">
    </div>
    <div class="control">
      <label>Trail fade <span class="val" id="fade-val">0.92</span></label>
      <input type="range" id="fade" min="0.70" max="1" step="0.01" value="0.92">
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-predator">Predator</button>
      <button class="btn" id="btn-reset">Reset</button>
      <button class="btn" id="btn-links">Links</button>
    </div>
    <div style="margin-top:1rem;padding-top:0.8rem;border-top:1px solid var(--border)">
      <div class="stat"><span>Boids</span><span class="num" id="stat-count">200</span></div>
      <div class="stat"><span>Avg speed</span><span class="num" id="stat-speed">—</span></div>
      <div class="stat"><span>FPS</span><span class="num" id="stat-fps">—</span></div>
    </div>
  </div>
</div>

<div class="hint" id="hint">Move to guide · Click to scatter · Each bird knows only its neighbors</div>
<button class="toggle-info" id="toggle-info" title="Toggle info">i</button>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W, H;

  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Parameters ---
  let pSep = 1.5, pAli = 1.0, pCoh = 0.8, pRad = 40, pFade = 0.92;
  let predatorMode = false;
  let showLinks = false;

  // --- Mouse ---
  const mouse = { x: -9999, y: -9999, active: false, down: false };
  cv.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  cv.addEventListener('mouseleave', () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
  cv.addEventListener('mousedown', e => {
    mouse.down = true;
    if (e.detail === 2) {
      // double-click: scatter
      for (const b of boids) {
        const dx = b.x - e.clientX, dy = b.y - e.clientY;
        const d = Math.hypot(dx, dy) || 1;
        if (d < 150) {
          b.vx += (dx / d) * 4;
          b.vy += (dy / d) * 4;
        }
      }
    }
  });
  cv.addEventListener('mouseup', () => { mouse.down = false; });

  // --- Boid ---
  const NUM = 200;
  const MAX_SPEED = 2.8;
  const MIN_SPEED = 0.4;
  const MAX_FORCE = 0.06;
  const TRAIL_LAYER = 1;

  let boids = [];

  function initBoids(){
    boids = [];
    for (let i = 0; i < NUM; i++){
      boids.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
      });
    }
  }
  initBoids();

  function limit(vx, vy, max){
    const m = Math.hypot(vx, vy);
    if (m > max && m > 0) return [vx / m * max, vy / m * max];
    return [vx, vy];
  }

  function step(){
    const rad2 = pRad * pRad;

    for (let i = 0; i < boids.length; i++){
      const b = boids[i];
      let sepX = 0, sepY = 0, sepCount = 0;
      let aliX = 0, aliY = 0, aliCount = 0;
      let cohX = 0, cohY = 0, cohCount = 0;

      for (let j = 0; j < boids.length; j++){
        if (i === j) continue;
        const o = boids[j];
        const dx = o.x - b.x, dy = o.y - b.y;
        const d2 = dx * dx + dy * dy;

        if (d2 < rad2 && d2 > 0){
          const d = Math.sqrt(d2);

          // Alignment: average velocity of neighbors
          aliX += o.vx; aliY += o.vy; aliCount++;

          // Cohesion: steer toward average position
          cohX += o.x; cohY += o.y; cohCount++;

          // Separation: steer away from close neighbors (within 1/2 perception)
          if (d2 < (pRad * 0.5) * (pRad * 0.5)){
            sepX -= dx / d; sepY -= dy / d; sepCount++;
          }
        }
      }

      // Accumulate forces
      let fx = 0, fy = 0;

      if (sepCount > 0){
        sepX /= sepCount; sepY /= sepCount;
        // Normalize and scale to max speed
        const sepMag = Math.hypot(sepX, sepY);
        if (sepMag > 0){
          sepX = sepX / sepMag * MAX_SPEED;
          sepY = sepY / sepMag * MAX_SPEED;
        }
        // Steer = desired - current
        const [smx, smy] = limit(sepX - b.vx, sepY - b.vy, MAX_FORCE);
        fx += smx * pSep * 2; fy += smy * pSep * 2;
      }

      if (aliCount > 0){
        aliX /= aliCount; aliY /= aliCount;
        const [alx, aly] = limit(aliX, aliY, MAX_SPEED);
        const [amx, amy] = limit(alx - b.vx, aly - b.vy, MAX_FORCE);
        fx += amx * pAli; fy += amy * pAli;
      }

      if (cohCount > 0){
        cohX /= cohCount; cohY /= cohCount;
        // steer toward center of mass
        const dx = cohX - b.x, dy = cohY - b.y;
        const [clx, cly] = limit(dx, dy, MAX_SPEED);
        const [cmx, cmy] = limit(clx - b.vx, cly - b.vy, MAX_FORCE);
        fx += cmx * pCoh; fy += cmy * pCoh;
      }

      // Mouse influence
      if (mouse.active){
        const dx = b.x - mouse.x, dy = b.y - mouse.y;
        const d = Math.hypot(dx, dy);
        if (d < 120 && d > 0){
          const strength = predatorMode ? 1.8 : 0.6;
          fx += (dx / d) * strength * (1 - d / 120) * 3;
          fy += (dy / d) * strength * (1 - d / 120) * 3;
        }
      }

      // Apply force
      b.vx += fx;
      b.vy += fy;

      // Limit speed
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > MAX_SPEED){ b.vx = b.vx / sp * MAX_SPEED; b.vy = b.vy / sp * MAX_SPEED; }
      if (sp < MIN_SPEED && sp > 0){ b.vx = b.vx / sp * MIN_SPEED; b.vy = b.vy / sp * MIN_SPEED; }

      // Move
      b.x += b.vx;
      b.y += b.vy;

      // Wrap edges (toroidal world)
      if (b.x < -10) b.x = W + 10;
      if (b.x > W + 10) b.x = -10;
      if (b.y < -10) b.y = H + 10;
      if (b.y > H + 10) b.y = -10;
    }
  }

  function render(){
    // Trail fade
    ctx.fillStyle = 'rgba(18,14,26,' + (1 - pFade) + ')';
    ctx.fillRect(0, 0, W, H);

    // Links between nearby boids
    if (showLinks){
      const linkR2 = (pRad * 0.6) * (pRad * 0.6);
      ctx.lineWidth = 0.5;
      for (let i = 0; i < boids.length; i++){
        for (let j = i + 1; j < boids.length; j++){
          const dx = boids[i].x - boids[j].x;
          const dy = boids[i].y - boids[j].y;
          const d2 = dx * dx + dy * dy;
          if (d2 < linkR2){
            const a = (1 - Math.sqrt(d2) / (pRad * 0.6)) * 0.12;
            ctx.strokeStyle = 'rgba(232,165,71,' + a + ')';
            ctx.beginPath();
            ctx.moveTo(boids[i].x, boids[i].y);
            ctx.lineTo(boids[j].x, boids[j].y);
            ctx.stroke();
          }
        }
      }
    }

    // Draw boids as triangles
    for (const b of boids){
      const speed = Math.hypot(b.vx, b.vy);
      const angle = Math.atan2(b.vy, b.vx);
      const sz = 4 + speed * 0.6;

      // Color: slower = deeper amber, faster = lighter gold
      const t = Math.min(speed / MAX_SPEED, 1);
      const r = Math.round(180 + t * 75);
      const g = Math.round(120 + t * 80);
      const bl = Math.round(50 + t * 50);

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);

      // Glow
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, sz * 2.5);
      glow.addColorStop(0, 'rgba(' + r + ',' + g + ',' + bl + ',0.15)');
      glow.addColorStop(1, 'rgba(' + r + ',' + g + ',' + bl + ',0)');
      ctx.fillStyle = glow;
      ctx.fillRect(-sz * 2.5, -sz * 2.5, sz * 5, sz * 5);

      // Body triangle
      ctx.beginPath();
      ctx.moveTo(sz, 0);
      ctx.lineTo(-sz * 0.6, -sz * 0.4);
      ctx.lineTo(-sz * 0.3, 0);
      ctx.lineTo(-sz * 0.6, sz * 0.4);
      ctx.closePath();
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + bl + ',0.85)';
      ctx.fill();

      ctx.restore();
    }

    // Mouse influence indicator
    if (mouse.active && mouse.x > -100){
      const r = 120;
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, r);
      if (predatorMode){
        g.addColorStop(0, 'rgba(200,60,60,0.12)');
        g.addColorStop(0.5, 'rgba(200,60,60,0.04)');
      } else {
        g.addColorStop(0, 'rgba(232,165,71,0.08)');
        g.addColorStop(0.5, 'rgba(232,165,71,0.02)');
      }
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // --- FPS tracking ---
  let frameCount = 0, lastFpsTime = performance.now(), fps = 0;
  let speedAccum = 0;

  function loop(){
    step();
    render();

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 500){
      fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
      frameCount = 0;
      lastFpsTime = now;

      // Avg speed
      let sp = 0;
      for (const b of boids) sp += Math.hypot(b.vx, b.vy);
      document.getElementById('stat-speed').textContent = (sp / boids.length).toFixed(2);
      document.getElementById('stat-fps').textContent = fps;
      document.getElementById('stat-count').textContent = boids.length;
    }

    requestAnimationFrame(loop);
  }

  // Initial fill
  ctx.fillStyle = '#120e1a';
  ctx.fillRect(0, 0, W, H);

  loop();

  // --- Controls ---
  function bindSlider(id, valId, callback){
    const el = document.getElementById(id);
    const val = document.getElementById(valId);
    el.addEventListener('input', () => {
      callback(parseFloat(el.value));
      val.textContent = el.id === 'rad' ? el.value : parseFloat(el.value).toFixed(2);
    });
  }
  bindSlider('sep', 'sep-val', v => pSep = v);
  bindSlider('ali', 'ali-val', v => pAli = v);
  bindSlider('coh', 'coh-val', v => pCoh = v);
  bindSlider('rad', 'rad-val', v => pRad = v);
  bindSlider('fade', 'fade-val', v => pFade = v);

  document.getElementById('btn-predator').addEventListener('click', e => {
    predatorMode = !predatorMode;
    e.target.classList.toggle('active', predatorMode);
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    initBoids();
    ctx.fillStyle = '#120e1a';
    ctx.fillRect(0, 0, W, H);
  });
  document.getElementById('btn-links').addEventListener('click', e => {
    showLinks = !showLinks;
    e.target.classList.toggle('active', showLinks);
  });

  // Toggle info
  let infoVisible = true;
  document.getElementById('toggle-info').addEventListener('click', () => {
    infoVisible = !infoVisible;
    document.getElementById('overlay').classList.toggle('hidden', !infoVisible);
    document.getElementById('hint').classList.toggle('hidden', !infoVisible);
  });

  // Hide hint after 8s
  setTimeout(() => document.getElementById('hint').classList.add('hidden'), 8000);
})();
</script>
</body>
</html>
